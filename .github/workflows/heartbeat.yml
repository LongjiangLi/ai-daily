name: digest-heartbeat

# 主触发：Cloudflare Worker 的 Cron Trigger（北京 09:33，错开 :00/:30）调用
#         workflow_dispatch，见 cloudflare/README.md；dispatch 秒级启动，检查时机是准的。
# 兜底：保留 1 档 GitHub schedule（北京 03:23 排队，实测延迟 5-7 小时后约
#       08:23-10:23 运行）。脚本内 --earliest 09:30 会让它早到时直接退出，所以
#       延迟短的日子这档什么都不做——那是正常的，主触发由 Worker 保证。
# 依赖 schedule 的兜底档要求仓库为 public（详见 daily.yml 顶部说明）。

on:
  schedule:
    # 北京 03:23 排队（UTC 19:23）。实测延迟 5h-7h，约 08:23-10:23 运行。
    # 分钟避开 :00 / :30，减少调度高峰的竞争。
    - cron: '23 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: read          # 只读：拉取 state.json，不回写

concurrency:
  group: digest-heartbeat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: true
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check today's digest and alert if missing
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 延迟消失时不要在凌晨发假告警；手动触发时不做限制。
            ARGS="--earliest 09:30"
          fi
          uv run heartbeat.py $ARGS
