name: digest-heartbeat

# 依赖 schedule，与 daily.yml 一样要求仓库为 public（详见 daily.yml 顶部说明）。

on:
  schedule:
    # 北京 03:05 排队。按 2026-11 实测的 6h20m ~ 7h03m 调度延迟，
    # 实际大约 09:24-10:10 运行；日报的小时档此时应已发出（最晚约 09:20）。
    # 脚本内 --earliest 09:30 保证延迟消失或日报还没到时不会发假告警。
    - cron: '5 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: read          # 只读：拉取 state.json，不回写

concurrency:
  group: digest-heartbeat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: true
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check today's digest and alert if missing
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 延迟消失时不要在凌晨发假告警；手动触发时不做限制。
            ARGS="--earliest 09:30"
          fi
          uv run heartbeat.py $ARGS
