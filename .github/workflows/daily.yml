name: daily-digest

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30
    # 注意：Actions 定时任务通常会延迟 5-20 分钟触发，属正常现象
    # 改推送时间时，这里和 config.yaml 的 push_time 必须同时改
    - cron: '30 0 * * *'
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write         # 用于把 state.json 提交回仓库

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # 与本地 uv 版本保持一致，避免 lock 文件格式不兼容导致 --frozen 失败
          version: "0.12.18"
          enable-cache: true
          python-version: '3.12'

      - name: Show versions
        run: |
          uv --version
          uv run python --version

      - name: Check secrets
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          for k in LLM_API_KEY SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM MAIL_TO; do
            if [ -n "${!k}" ]; then echo "✓ $k"; else echo "✗ $k 未配置"; fi
          done

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run digest
        env:
          LLM_API_KEY:        ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL:       ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:          ${{ secrets.LLM_MODEL }}
          LLM_REASONING_MODEL: ${{ secrets.LLM_REASONING_MODEL }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          MAIL_FROM:          ${{ secrets.MAIL_FROM }}
          MAIL_TO:            ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
        run: uv run main.py

      - name: Persist state
        run: |
          if [ ! -f state.json ]; then echo "no state.json"; exit 0; fi
          git config user.name  "ai-daily-bot"
          git config user.email "ai-daily-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update state [skip ci]"
            git push
          fi
