name: daily-digest

# 注意：GitHub 的 schedule 只在「public 仓库」上稳定注册和触发。
# 本仓库 2026-11-11 之前是 private（个人免费账号），schedule 从未产生过
# 任何运行记录（event=schedule 长期为 0），只有 workflow_dispatch 能用。
# 因此仓库已转为 public；若以后改回 private，定时任务会再次失效。

on:
  schedule:
    # 主任务：UTC 00:17 = 北京 08:17。避开 UTC 整点（00:00）的调度高峰，
    # 但 GitHub 的 schedule 仍是 best-effort，可能延迟数小时甚至被直接丢弃。
    # 兜底：UTC 00:40 = 北京 08:40。主任务没跑成时由它补发；
    # main.py 用 state.json 的 last_sent_date 保证同一天只发一封。
    - cron: '17 0 * * *'
    - cron: '40 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '今天已发过也强制重发（忽略 last_sent_date 检查）'
        type: boolean
        default: false

permissions:
  contents: write         # 用于把 state.json 提交回仓库

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # 与本地 uv 版本保持一致，避免 lock 文件格式不兼容导致 --frozen 失败
          version: "0.12.18"
          enable-cache: true
          python-version: '3.12'

      - name: Show versions
        run: |
          uv --version
          uv run python --version

      - name: Check secrets
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          for k in LLM_API_KEY SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM MAIL_TO; do
            if [ -n "${!k}" ]; then echo "✓ $k"; else echo "✗ $k 未配置"; fi
          done

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run digest
        env:
          LLM_API_KEY:        ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL:       ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:          ${{ secrets.LLM_MODEL }}
          LLM_REASONING_MODEL: ${{ secrets.LLM_REASONING_MODEL }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          MAIL_FROM:          ${{ secrets.MAIL_FROM }}
          MAIL_TO:            ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--now"
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          uv run main.py $ARGS

      - name: Persist state
        run: |
          if [ ! -f state.json ]; then echo "no state.json"; exit 0; fi
          git config user.name  "ai-daily-bot"
          git config user.email "ai-daily-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update state [skip ci]"
            git push
          fi
