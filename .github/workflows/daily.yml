name: daily-digest

# 触发方式（2026-11-13 起）：
#
#   主触发：Cloudflare Worker 的 Cron Trigger（北京 08:27，刻意错开 :00/:30）
#   调用本 workflow 的 workflow_dispatch，见 cloudflare/README.md。dispatch 不
#   经过 GitHub 的定时队列，实测秒级启动，邮件约 08:30-08:33 到达。
#
#   兜底：本文件只保留 1 档 GitHub schedule（北京 08:36，同样错开 :00/:30）。
#   GitHub 的 schedule 是 best-effort（2026-11 实测延迟 5h24-7h03，且高负载时
#   会静默丢弃），所以这档在 Worker 正常时只会读到「今天已发」然后秒退；只有
#   Worker 失效时它才真正发信（通常已是下午）。main.py --earliest 08:30 保证它
#   不会在凌晨误发；state.json 的 last_sent_date 保证同一天只发一封。
#
#   手动：Actions 页面 Run workflow（勾 force 可忽略当天已发记录强制重发）。
#
# 注意：GitHub 的 schedule 只在 public 仓库上稳定注册和触发。本仓库 2026-11-11
# 之前是 private，event=schedule 长期为 0；若以后改回 private，兜底档会失效，
# 但 Worker 的 dispatch 不受影响。

on:
  schedule:
    # 北京 08:36（UTC 00:36）：Worker 触发后约 9 分钟，正常情况下只会读到
    # last_sent_date=今天 然后秒退；Worker 没触发时才由这一档兜底。
    # 分钟避开 :00 / :30，减少调度高峰的竞争。
    - cron: '36 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '今天已发过也强制重发（忽略 last_sent_date 与最早时间检查）'
        type: boolean
        default: false

permissions:
  contents: write         # 用于把 state.json 提交回仓库

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Worker 的 dispatch 和兜底 cron 可能先后触发。run 的 SHA 是入队时解析的，
      # 可能落后于前一个 run 刚提交的 state.json；先同步到最新 main，确保
      # last_sent_date 检查看到的是最新状态，避免重复发信。
      - name: Sync with latest main
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard --quiet origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # 与本地 uv 版本保持一致，避免 lock 文件格式不兼容导致 --frozen 失败
          version: "0.12.18"
          enable-cache: true
          python-version: '3.12'

      - name: Show versions
        run: |
          uv --version
          uv run python --version

      - name: Check secrets
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          for k in LLM_API_KEY SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM MAIL_TO; do
            if [ -n "${!k}" ]; then echo "✓ $k"; else echo "✗ $k 未配置"; fi
          done

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run digest
        env:
          LLM_API_KEY:        ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL:       ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:          ${{ secrets.LLM_MODEL }}
          LLM_REASONING_MODEL: ${{ secrets.LLM_REASONING_MODEL }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          MAIL_FROM:          ${{ secrets.MAIL_FROM }}
          MAIL_TO:            ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--now"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 兜底闸门：早于北京时间 08:30 不发。正常这档在 08:36 之后才跑；
            # 万一 cron 被改早，也不会在凌晨误发。
            # 手动 Run workflow 和 Worker 的 dispatch 都不受限制。
            ARGS="$ARGS --earliest 08:30"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          uv run main.py $ARGS

      - name: Persist state
        run: |
          if [ ! -f state.json ]; then echo "no state.json"; exit 0; fi
          git config user.name  "ai-daily-bot"
          git config user.email "ai-daily-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update state [skip ci]"
            git push
          fi
