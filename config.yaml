# ================= 时间与窗口 =================
timezone: Asia/Shanghai
# 计划任务的 cron 在 .github/workflows/daily.yml：北京 01:20-08:20 每小时
# 排一档「提前量」（8 档/天），用来吸收 GitHub 0~7.3h 的调度延迟。实际发信
# 时间由 main.py --earliest 08:20 把关：哪一档落到 08:20 之后，就由哪一档发送。
# 实测 6h19-7h03 的延迟下约 08:23-08:39 到达；延迟落在中间值时最晚约 09:20。
# 定时任务用 --now 运行，统计窗口 = 最近 24h（截止到实际触发时刻），
# 这样 Actions 的触发延迟不会造成漏采；重复条目靠 state.json 去重，
# 同一天重复触发靠 state.json 的 last_sent_date 跳过（--force 可强制重发）。
# 下面的 push_time 只影响「手动运行且不带 --now」时的窗口锚点。
push_time: "08:20"

# ================= LLM =================
llm:
  provider: deepseek            # deepseek | claude | openai（兼容 OpenAI 协议即可）
  base_url: https://api.deepseek.com
  model: deepseek-chat          # 批量打分/抽取：便宜、快
  reasoning_model: deepseek-reasoner  # 仅用于「前沿影响分析」
  # 0 = 尽量确定性输出；同一天重复运行结果更稳定
  temperature: 0
  max_tokens: 4000
  # 预算估算用（元 / 百万 token），仅用于打印成本
  price_input_per_m: 2.0
  price_output_per_m: 3.0

# ================= 板块配额 =================
# 内容不足时不凑数：允许 LLM 返回空数组
sections:
  llm_local:    { min: 3, max: 5 }
  llm_frontier: { min: 1, max: 3 }
  github:       { min: 3, max: 5 }
  agent:        { min: 2, max: 3 }
  news:         { min: 3, max: 4 }

# ================= 数据源 =================
# window_hours：每个源的回看窗口（小时）
# 论文、模型发布有延迟，严格 24h 会漏掉；RSS/HN 保持 24-36h 即可
collectors:
  github:
    enabled: true
    window_hours: 24
    per_page: 30
    min_stars: 10
    # 额外抓「近 24h 有推送的成熟仓库」：这些才值得读源码/直接复用；
    # 只抓 created:>=昨天 会全是几十 star 的空仓库。
    include_active: true
    active_min_stars: 200    # 成熟仓库的 star 门槛
    topics:
      - topic:llm
      - topic:ai-agents
      - topic:agent
      - topic:rag
      - topic:mcp
      - topic:llm-inference
      # Java 后端的 Agent 技术栈，和读者背景直接相关
      - topic:spring-ai
      - topic:langchain4j

  huggingface:
    enabled: true
    window_hours: 72        # 兜底窗口（下面两项未配置时才用它）
    # 模型榜是「近期热门」而不是「刚发布」，createdAt 往往在几周前；
    # 72h 只会剩下个位数候选，本地模型板块几乎必然为空
    models_window_hours: 336   # 14 天
    # HF daily papers 周末会停更，且公告有延迟；168h 能覆盖一个完整周末
    papers_window_hours: 168   # 7 天
    models_limit: 60        # 拉取候选数量
    detail_limit: 15        # 拉取模型详情的数量（用于取参数/许可证）
    readme_limit: 8         # 拉取 README 的数量（显存/速度信息来源）
    min_likes: 5
    papers_limit: 30

  arxiv:
    enabled: true
    window_hours: 72        # arXiv 公告有 1-2 天延迟
    categories: [cs.CL, cs.AI, cs.MA]
    max_results: 40

  hackernews:
    enabled: true
    window_hours: 24
    min_points: 50
    queries: [LLM, "AI agent", "open source model"]

  rss:
    enabled: true
    window_hours: 36
    # 注意：部分站点 RSS 地址会变，失效时看日志里的 [rss] 报错
    feeds:
      # 注意：Anthropic 官方没有 RSS，相关内容靠 HN / Simon Willison 覆盖
      - { name: OpenAI,           url: "https://openai.com/news/rss.xml" }
      - { name: Google DeepMind,  url: "https://deepmind.google/blog/rss.xml" }
      - { name: HuggingFace Blog, url: "https://huggingface.co/blog/feed.xml" }
      - { name: Simon Willison,   url: "https://simonwillison.net/atom/everything/" }
      # 旧地址 blog.langchain.dev/rss/ 已 301 到博客 HTML，feedparser 会解析出 0 条
      - { name: LangChain,        url: "https://www.langchain.com/blog/rss.xml" }
      # 机器之心 RSS 已改为跳转到 data-service 页面，暂无可用 feed，先移除。
      # 想恢复时换成可用的 RSS 地址再加回来。
      - { name: 量子位,            url: "https://www.qbitai.com/feed" }

  reddit:
    # 已关闭：匿名 RSS 限流严重，且 GitHub Actions 的机房 IP 常被直接拦截。
    # 日报价值主要由 HF / arXiv / GitHub / RSS 提供，Reddit 只是补充。
    # 想重新启用：改成 true，并确认当前网络能稳定抓到。
    enabled: false
    window_hours: 24
    delay_seconds: 8        # 板块之间的间隔，太小会 429
    subreddits: [LocalLLaMA]

# ================= 粗筛 =================
prefilter:
  max_total: 90            # 送进 LLM 的最大条目数（直接决定成本）
  max_per_source: 25
  min_relevance: 1         # 关键词命中数下限
  # 只对这几类做关键词过滤；其余（GitHub / RSS / arXiv 等垂类源）默认都相关
  filter_sources: [hackernews, hf_model, reddit]
  # GitHub 候选混合排序，避免名额全被大厂项目占满：
  #   成熟项目（建仓 ≥180 天，按 star）
  #   高成长新仓库（建仓 ≤90 天，按 star/天）
  #   读者的技术栈（language: Java，按 star）
  # 某一类不足时自动用剩余条目按 star 补满到 max_per_source
  github_mix:
    mature: 12
    growth: 8
    java: 5
    mature_min_age_days: 180
    growth_min_age_days: 7    # 太新的仓库多半是实验品，放几天再看成长性
    growth_max_age_days: 90

